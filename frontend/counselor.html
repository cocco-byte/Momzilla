<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Counselor alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; }
  .note { font-size: 13px; color: #666; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  .tier-medium { color: #a06a00; }
  .tier-high { color: #b3491c; font-weight: 600; }
  .tier-imminent { color: #c0152f; font-weight: 700; }
  #login { max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
  #login input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  #login button { padding: 10px; border: none; border-radius: 6px; background: #6c63ff; color: white; cursor: pointer; }
  #error { color: #c0152f; font-size: 13px; min-height: 18px; }
  #dashboard { display: none; }
  #signout { font-size: 13px; color: #666; background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; }
</style>
</head>
<body>
  <div id="login">
    <h2>Counselor sign in</h2>
    <input id="username" type="text" placeholder="Username" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="signin">Sign in</button>
    <div id="error"></div>
  </div>

  <div id="dashboard">
    <h2>Check-in alerts <button id="signout">sign out</button></h2>
    <p class="note">
      Each row means a conversation suggested this student might benefit from
      a check-in - no conversation content is ever available, here or
      anywhere else in this system.
    </p>
    <table>
      <thead><tr><th>Student</th><th>Level</th><th>When</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const API_BASE = window.MOMZILLA_API_BASE || "http://localhost:8000";
    let pollTimer = null;

    function token() {
      try { return sessionStorage.getItem("momzilla_token"); } catch { return null; }
    }
    function setToken(t) {
      try { sessionStorage.setItem("momzilla_token", t); } catch {}
    }
    function clearToken() {
      try { sessionStorage.removeItem("momzilla_token"); } catch {}
    }

    async function load() {
      const res = await fetch(`${API_BASE}/counselor/alerts`, {
        headers: { Authorization: `Bearer ${token()}` },
      });
      if (res.status === 401) return signOut();
      const alerts = await res.json();
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      for (const a of alerts) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${a.student_id}</td><td class="tier-${a.tier}">${a.tier}</td><td>${new Date(a.created_at).toLocaleString()}</td>`;
        rows.appendChild(tr);
      }
    }

    function showDashboard() {
      document.getElementById("login").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      load();
      pollTimer = setInterval(load, 10000);
    }

    function signOut() {
      clearToken();
      if (pollTimer) clearInterval(pollTimer);
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("login").style.display = "flex";
    }

    document.getElementById("signin").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) {
          errorEl.textContent = "Incorrect username or password.";
          return;
        }
        const data = await res.json();
        setToken(data.access_token);
        showDashboard();
      } catch {
        errorEl.textContent = "Couldn't reach the server.";
      }
    });

    document.getElementById("signout").addEventListener("click", signOut);

    if (token()) showDashboard();
  </script>
</body>
</html>
